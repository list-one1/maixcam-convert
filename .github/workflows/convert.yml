name: Convert ONNX to cvimodel

on:
  push:
    paths:
      - "best.onnx"
      - ".github/workflows/convert.yml"
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name"
        default: "yolo11n_card"
      quantize:
        description: "Quantization (BF16 or INT8)"
        default: "BF16"
        options:
          - "BF16"
          - "INT8"

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tpu_mlir
        run: |
          pip install --upgrade pip
          pip install tpu_mlir onnx onnxruntime
          echo "=== Verify tools ==="
          which model_transform.py
          which model_deploy.py

      - name: Convert ONNX to cviModel
        run: |
          MODEL_NAME="${{ inputs.model_name || 'yolo11n_card' }}"
          QUANTIZE="${{ inputs.quantize || 'BF16' }}"
          INPUT_SIZE=640
          MODEL_SUFFIX=$(echo "$QUANTIZE" | tr '[:upper:]' '[:lower:]')
          mkdir -p workspace

          echo "=== Model: ${MODEL_NAME}, Input: ${INPUT_SIZE}, Quantize: ${QUANTIZE} ==="

          echo "=== Step 1: ONNX -> MLIR ==="
          model_transform.py \
            --model_name "${MODEL_NAME}" \
            --model_def best.onnx \
            --input_shapes "[[1,3,${INPUT_SIZE},${INPUT_SIZE}]]" \
            --mean "0,0,0" \
            --scale "0.00392156862745098,0.00392156862745098,0.00392156862745098" \
            --pixel_format rgb \
            --channel_format nchw \
            --output_names "output0" \
            --tolerance 0.99,0.99 \
            --mlir "workspace/${MODEL_NAME}.mlir"

          echo "=== Step 2: MLIR -> cvimodel (${QUANTIZE}) ==="
          model_deploy.py \
            --mlir "workspace/${MODEL_NAME}.mlir" \
            --quantize "${QUANTIZE}" \
            --quant_input \
            --processor cv181x \
            --tolerance 0.99,0.99 \
            --model "workspace/${MODEL_NAME}_${MODEL_SUFFIX}.cvimodel"

          echo "=== Result ==="
          ls -la workspace/
          echo "cvimodel size: $(stat -c%s workspace/${MODEL_NAME}_${MODEL_SUFFIX}.cvimodel 2>/dev/null || echo 'N/A') bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maixcam-model
          path: |
            workspace/*.cvimodel
            *.mud
          retention-days: 90
