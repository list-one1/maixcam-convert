name: Convert ONNX to cvimodel

on:
  push:
    paths:
      - "best.onnx"
      - "convert_model.sh"
      - ".github/workflows/convert.yml"
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name"
        default: "yolo11n_card"
      quantize:
        description: "Quantization (BF16 or INT8)"
        default: "INT8"
        options:
          - "BF16"
          - "INT8"

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: sophgo/tpuc_dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install tpu-mlir
        run: |
          pip install tpu_mlir --quiet || true
          pip install onnx onnxruntime psutil --quiet || true

      - name: Convert ONNX to MLIR
        run: |
          MODEL_NAME="${{ inputs.model_name || 'yolo11n_card' }}"
          INPUT_SIZE=640

          echo "=== Step 1: ONNX -> MLIR ==="
          mkdir -p workspace

          model_transform.py \
            --model_name "${MODEL_NAME}" \
            --model_def best.onnx \
            --input_shapes "[[1,3,${INPUT_SIZE},${INPUT_SIZE}]]" \
            --mean "0,0,0" \
            --scale "0.00392156862745098,0.00392156862745098,0.00392156862745098" \
            --pixel_format rgb \
            --channel_format nchw \
            --output_names "output0" \
            --tolerance 0.99,0.99 \
            --mlir "workspace/${MODEL_NAME}.mlir"

      - name: Deploy to cvimodel
        run: |
          MODEL_NAME="${{ inputs.model_name || 'yolo11n_card' }}"
          QUANTIZE="${{ inputs.quantize || 'INT8' }}"
          MODEL_SUFFIX=$(echo "$QUANTIZE" | tr '[:upper:]' '[:lower:]')

          echo "=== Step 2: MLIR -> cvimodel ($QUANTIZE) ==="

          model_deploy.py \
            --mlir "workspace/${MODEL_NAME}.mlir" \
            --quantize "${QUANTIZE}" \
            --quant_input \
            --processor cv181x \
            --tolerance 0.99,0.99 \
            --model "workspace/${MODEL_NAME}_${MODEL_SUFFIX}.cvimodel"

      - name: Upload cvimodel artifact
        uses: actions/upload-artifact@v4
        with:
          name: maixcam-model
          path: |
            workspace/*.cvimodel
            *.mud
          retention-days: 90
